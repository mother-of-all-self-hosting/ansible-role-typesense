---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  - name: typesense-${MOLECULE_DISTRO:-ubuntu2604}-default
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        # Helper variables
        typesense_debug_service_enabled: false

        # Variables for Typesense
        typesense_uid: 1000
        typesense_gid: 1000
        typesense_scheme: http
        typesense_hostname: localhost
        typesense_container_labels_traefik_enabled: false
        typesense_container_http_host_bind_port: 8108

        # Deliberately not Typesense's own default of 8108. The role renders it into
        # TYPESENSE_API_PORT, so the process only listens here if the role's `env`
        # template reached it; the container is then published as 8108:8111 and every
        # HTTP check in verify.yml would hit a closed port otherwise.
        typesense_container_http_port: 8111

        # A value that nothing but this file could have produced, so that a 200 from
        # an endpoint requiring it proves the role's `env` template reached the
        # process rather than some fallback. See verify.yml.
        typesense_environment_variables_api_key: molecule-typesense-4f2b9c1e
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
verifier:
  name: ansible
